name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Detect integration database secret
        id: integration
        env:
          HAS_SECRET: ${{ secrets.TEST_DATABASE_URL != '' }}
        run: echo "enabled=$HAS_SECRET" >> "$GITHUB_OUTPUT"
      - name: Integration tests
        if: steps.integration.outputs.enabled == 'true'
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: npm run test:integration
