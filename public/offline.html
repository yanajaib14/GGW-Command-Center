<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline - GGW Command Center</title>
    <style>
      :root { --bg: #f6f8f4; --fg: #1a1f1b; --muted: #566058; --accent: #2f6b3a; --accent-fg: #ffffff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1410; --fg: #edf2ed; --muted: #a4afa6; --accent: #8cc795; --accent-fg: #0c1a0f; }
      }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px; box-sizing: border-box; background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 17px; }
      main { max-width: 28rem; text-align: center; }
      h1 { font-size: 24px; margin: 0 0 12px; }
      p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px;
        border-radius: 10px; background: var(--accent); color: var(--accent-fg); text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>GGW Command Center needs a connection to load your data. Check your signal or Wi-Fi, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
